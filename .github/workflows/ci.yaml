name: CI

on:
  push:
  pull_request:

jobs:
  package:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The example is a Flutter app; the "Example app" job resolves it.
      - run: dart pub get --no-example
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test with coverage
        run: dart test --coverage=coverage
      - name: Coverage report
        run: >-
          dart run coverage:format_coverage --lcov --in=coverage
          --out=coverage/lcov.info --report-on=lib
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
      - name: API docs
        run: dart doc

  pana:
    name: Package score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub global activate pana
      - name: pana
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .

  example:
    name: Example app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
