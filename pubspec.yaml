name: aws_iot_core
description: >-
  AWS IoT Core MQTT client for Dart and Flutter: SigV4 WebSockets with Cognito
  credentials, re-signing on reconnect, wildcard topics and Device Shadow.
version: 0.1.0
repository: https://github.com/vishnuprasad0/aws_iot_core
issue_tracker: https://github.com/vishnuprasad0/aws_iot_core/issues

topics:
  - aws
  - iot
  - mqtt
  - shadow
  - cognito

environment:
  sdk: ^3.8.0

dependencies:
  crypto: ^3.0.6
  mqtt_client: ^10.11.0
  typed_data: ^1.3.2

dev_dependencies:
  aws_common: ^0.7.13
  aws_signature_v4: ^0.6.10
  coverage: ^1.15.0
  lints: ^6.0.0
  test: ^1.26.2
